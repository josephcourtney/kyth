name: V1 release preflight

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: v1-release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just release-check
      - name: Installed-wheel smoke
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv venv .cache/release-smoke
          uv pip install --python .cache/release-smoke/bin/python "$wheel"
          .cache/release-smoke/bin/kyth --help
          .cache/release-smoke/bin/python -c 'from kyth.injection import client_script, depend_on, depend_on_data, register_readiness_check; print("public injection imports ok")'
