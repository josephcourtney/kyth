name: Phase 10 validation

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: phase10-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff format --diff tests/browser/browser_acceptance.py
      - run: uv run just check
      - run: uv run just complexity --strict

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just browser-install
      - run: uv run just browser-test
