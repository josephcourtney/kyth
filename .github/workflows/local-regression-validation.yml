name: Local regression validation

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: local-regression-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-python314:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just check
