name: Release recipe validation

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: release-recipe-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just release-check
