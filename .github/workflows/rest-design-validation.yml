name: Rest design validation
# Temporary validation only; removed after this implementation pass.

on:
  push:
    branches:
      - rewrite/dev-server-v1

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: uv run just check
      - run: uv run just complexity --strict

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.14"
      - run: uv sync
      - run: |
          PLAYWRIGHT_BROWSERS_PATH=.cache/playwright \
            uv run --with "playwright==1.63.0" \
            playwright install --with-deps chromium firefox
      - run: uv run just browser-test
