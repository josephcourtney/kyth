name: Python 3.14.0 local regression

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: python-3140-local-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-python3140:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.0"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just test
