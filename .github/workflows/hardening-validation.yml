name: Hardening validation

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: hardening-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just format
      - run: git diff --exit-code
      - run: uv run just check
      - run: uv run just complexity --strict

  browser:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run --with "playwright==1.63.0" playwright install --with-deps chromium firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      - run: uv run just browser-test
