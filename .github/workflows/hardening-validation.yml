name: Hardening validation

on:
  push:
    branches:
      - rewrite/dev-server-v1

concurrency:
  group: hardening-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just format
      - run: git diff --exit-code
      - name: syntax
        run: uv run just syntax
      - name: lint
        run: uv run just lint --no-fix
      - name: typecheck
        run: MODE=ci uv run just typecheck
      - name: import architecture
        run: uv run just lint-imports
      - name: tests
        run: uv run just test
      - name: coverage report
        run: uv run just cov
      - name: strict complexity
        run: uv run just complexity --strict

  lifecycle-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: watcher, process, socket, and lifecycle rehearsal
        run: >-
          uv run pytest --no-cov --timeout=300
          tests/test_watcher.py
          tests/test_process_child.py
          tests/test_process_manager.py
          tests/test_lifecycle.py

  browser:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run --with "playwright==1.63.0" playwright install --with-deps chromium firefox
        env:
          PLAYWRIGHT_BROWSERS_PATH: .cache/playwright
      - run: uv run just browser-test
