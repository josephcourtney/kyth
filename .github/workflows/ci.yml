name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just check
      - run: uv run just complexity --strict

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just browser-install
      - run: uv run just browser-test
      - name: Run example project E2E
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.cache/playwright" \
            uv run --with "playwright==1.63.0" \
              --with "jinja2>=3.1,<4" \
              pytest -o cache_dir="$PWD/.cache/pytest" --no-cov \
              tests/browser/e2e_examples.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - check
      - browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run just release-check
