[tool.importlinter]
  root_package              = "kyth"
  include_external_packages = false

  [[tool.importlinter.contracts]]
    name = "non-cli modules must not depend on cli"
    type = "forbidden"
    source_modules = [
      "kyth.asgi",
      "kyth.browser",
      "kyth.constants",
      "kyth.core",
      "kyth.injection",
      "kyth.logging",
      "kyth.server",
      "kyth.static",
      "kyth.watcher",
    ]
    forbidden_modules = [
      "kyth.cli",
    ]

  [[tool.importlinter.contracts]]
    name = "low-level modules must not depend on server or asgi"
    type = "forbidden"
    source_modules = [
      "kyth.constants",
      "kyth.injection",
      "kyth.logging",
      "kyth.watcher",
    ]
    forbidden_modules = [
      "kyth.server",
      "kyth.asgi",
      "kyth.cli",
    ]

  [[tool.importlinter.contracts]]
    name = "browser must not depend on server or asgi"
    type = "forbidden"
    source_modules = [
      "kyth.browser",
    ]
    forbidden_modules = [
      "kyth.server",
      "kyth.asgi",
      "kyth.cli",
    ]
